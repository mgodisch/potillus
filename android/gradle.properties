# Enable AndroidX (mandatory for all modern Android projects)
#
# AGP 10 READINESS (checked, nothing to do). AGP 9.0 deprecated the previous DSL,
# and per its release notes the opt-out from the new one goes away in AGP 10.0,
# expected mid-2026. This project is clear of that migration, verified rather
# than assumed: no `newDsl` opt-out is set here, and no build script references
# the old variant API (`applicationVariants`, `libraryVariants`, `BaseVariant`
# or a variant's `outputs`). The residual risk is not the project's own scripts
# but its third-party plugins -- cyclonedx, ktlint, kover, ksp -- any of which
# may still reach for interfaces AGP 10 no longer exposes. Re-check their
# release notes when AGP 10 lands rather than upgrading blind.
android.useAndroidX=true

# Gradle daemon, parallel builds and caching
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Show individual deprecation warnings on every build so they are never
# silently ignored. Gradle emits a summary-only message by default; "all"
# expands it to the per-feature detail needed to identify the source
# (own scripts vs. a plugin dependency).
#
# WHAT THE WARNINGS CURRENTLY SAY, so a reader does not chase them: configuring
# `:app` under Gradle 9.6 raises four deprecations for passing a `Project` as a
# dependency notation, the form Gradle 10 will reject. None originates in this
# repository. Gradle's problems report
# (`android/build/reports/problems/problems-report.html`, written by any build)
# attributes one to the Kover plugin, settled by the 0.9.9 upgrade, and three to
# AGP's own `com.android.internal.application`. Raising AGP by a minor version is
# not the remedy: the deprecation arrived with Gradle 9.6 and hit the plugin
# ecosystem broadly, and on the GraalVM native-build-tools issue the Gradle team
# answered that only a change inside the plugin removes it. So these three clear
# when Google ships the fix, on Google's schedule. Re-read the problems report
# when raising AGP, and again before moving the wrapper to Gradle 10.
org.gradle.warning.mode=all

# Kotlin code style
kotlin.code.style=official
